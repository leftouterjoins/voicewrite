name: Bug Report
description: Report something that's not working correctly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below to help us investigate.

  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: "Your macOS version (e.g., macOS 26.0)"
      placeholder: "macOS 26.0"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: VoiceWrite Version
      description: "Found in the menu bar or About VoiceWrite"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
      placeholder: "Describe what went wrong..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
      placeholder: "Describe what you expected..."

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open VoiceWrite
        2. Press the hotkey
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console logs
      description: |
        If applicable, paste relevant logs from Console.app.
        Filter by "VoiceWrite" to see app-specific messages.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this isn't a duplicate
          required: true
