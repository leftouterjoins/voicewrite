name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: VoiceWrite

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Release
        run: swift build -c release

      - name: Create App Bundle
        run: |
          APP_BUNDLE="${APP_NAME}.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          mkdir -p "${APP_BUNDLE}/Contents/Frameworks"

          # Copy binary
          cp .build/release/${APP_NAME} "${APP_BUNDLE}/Contents/MacOS/"

          # Add rpath so binary can find Sparkle.framework
          install_name_tool -add_rpath @executable_path/../Frameworks "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"

          # Copy Info.plist
          cp VoiceWrite/Info.plist "${APP_BUNDLE}/Contents/"

          # Copy entitlements for reference
          cp VoiceWrite/VoiceWrite.entitlements "${APP_BUNDLE}/Contents/Resources/" || true

          # Create PkgInfo
          echo "APPL????" > "${APP_BUNDLE}/Contents/PkgInfo"

          # Copy Sparkle framework
          cp -R .build/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework "${APP_BUNDLE}/Contents/Frameworks/"

          # Copy resource bundles (KeyboardShortcuts)
          cp -r .build/arm64-apple-macosx/release/*.bundle "${APP_BUNDLE}/Contents/Resources/" 2>/dev/null || true

          # Copy app icon
          cp VoiceWrite/AppIcon.icns "${APP_BUNDLE}/Contents/Resources/" || true

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then echo "No certificate, skipping"; exit 0; fi
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Find signing identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV

          # Sign Sparkle components (order matters - XPC services first, with timestamp for notarization)
          codesign -f -s "$IDENTITY" --timestamp -o runtime \
            "${APP_NAME}.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          codesign -f -s "$IDENTITY" --timestamp -o runtime --preserve-metadata=entitlements \
            "${APP_NAME}.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          codesign -f -s "$IDENTITY" --timestamp -o runtime \
            "${APP_NAME}.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          codesign -f -s "$IDENTITY" --timestamp -o runtime \
            "${APP_NAME}.app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          # Sign the Sparkle binary explicitly before signing the framework
          codesign -f -s "$IDENTITY" --timestamp -o runtime \
            "${APP_NAME}.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          codesign -f -s "$IDENTITY" --timestamp -o runtime \
            "${APP_NAME}.app/Contents/Frameworks/Sparkle.framework"

          # Sign resource bundles
          for bundle in "${APP_NAME}.app/Contents/Resources/"*.bundle; do
            [ -e "$bundle" ] && codesign -f -s "$IDENTITY" --timestamp -o runtime "$bundle" || true
          done

          # Sign main app last (no --deep!)
          codesign -f -s "$IDENTITY" --timestamp -o runtime --entitlements VoiceWrite/VoiceWrite.entitlements "${APP_NAME}.app"

          # Verify signature
          codesign --verify --verbose "${APP_NAME}.app"

      - name: Create DMG
        run: |
          # Create DMG folder structure
          mkdir -p dmg_contents
          cp -r "${APP_NAME}.app" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "${APP_NAME}-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Create ZIP for Sparkle
        run: |
          # Use ditto (not zip) to preserve symlinks and metadata
          ditto -c -k --keepParent "${APP_NAME}.app" "${APP_NAME}-${{ steps.version.outputs.VERSION }}.zip"

      - name: Notarize DMG and ZIP
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then echo "No Apple ID, skipping notarization"; exit 0; fi
          # Notarize DMG
          xcrun notarytool submit "${APP_NAME}-${{ steps.version.outputs.VERSION }}.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "${APP_NAME}-${{ steps.version.outputs.VERSION }}.dmg"

          # Notarize ZIP (for Sparkle updates)
          xcrun notarytool submit "${APP_NAME}-${{ steps.version.outputs.VERSION }}.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          # Re-create ZIP after stapling the app
          xcrun stapler staple "${APP_NAME}.app"
          ditto -c -k --keepParent "${APP_NAME}.app" "${APP_NAME}-${{ steps.version.outputs.VERSION }}.zip"

      - name: Sign update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then echo "No Sparkle key, skipping"; exit 0; fi
          # Save private key to temp file
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          chmod 600 /tmp/sparkle_key

          # Sign the update and capture signature
          SIGNATURE=$(.build/artifacts/sparkle/Sparkle/bin/sign_update \
            "${APP_NAME}-${{ steps.version.outputs.VERSION }}.zip" \
            --ed-key-file /tmp/sparkle_key | grep "sparkle:edSignature" | sed 's/.*sparkle:edSignature="\([^"]*\)".*/\1/')

          echo "SPARKLE_SIGNATURE=$SIGNATURE" >> $GITHUB_ENV

          # Get file size
          FILE_SIZE=$(stat -f%z "${APP_NAME}-${{ steps.version.outputs.VERSION }}.zip")
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV

          # Clean up
          rm /tmp/sparkle_key

      - name: Update appcast.xml
        if: ${{ env.SPARKLE_SIGNATURE != '' }}
        run: |
          python3 scripts/update_appcast.py \
            --version "${{ steps.version.outputs.VERSION }}" \
            --signature "$SPARKLE_SIGNATURE" \
            --size "$FILE_SIZE"

      - name: Commit appcast changes
        if: ${{ env.SPARKLE_SIGNATURE != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Update appcast for v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:master

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}.dmg
            ${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}.zip
          body: |
            ## VoiceWrite ${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/leftouterjoins/voicewrite/blob/main/CHANGELOG.md) for details.

            ### Installation
            1. Download the DMG below
            2. Open it and drag VoiceWrite to Applications
            3. Launch VoiceWrite from Applications

            ### Automatic Updates
            Existing users will receive this update automatically.

            ### Requirements
            - macOS 26.0 (Tahoe) or later
            - Microphone permission
            - Accessibility permission
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
